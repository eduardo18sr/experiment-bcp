command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  # Plataforma MRM. Sin MRM_RAIZ_EXPEDIENTES la app arranca en modo demo con expedientes sintéticos.
  # Para trabajar con un Volume de Unity Catalog, agregar el Volume como recurso de la app y descomentar:
  # - name: MRM_RAIZ_EXPEDIENTES
  #   value: "/Volumes/workspace/mrm/mrm/expedientes"
  # - name: MRM_RAIZ_RESULTADOS
  #   value: "/Volumes/workspace/mrm/mrm/resultados"
  # - name: MRM_GRAFO
  #   value: "/Volumes/workspace/mrm/mrm/conocimiento/grafo.json"
  # - name: MRM_INDICE_VECTORIAL
  #   value: "workspace.mrm.kg_fragmentos_indice"
  - name: MRM_JUEZ_HABILITADO
    value: "true"
  - name: MRM_ENDPOINT_JUEZ
    value: "databricks-claude-sonnet-5-5"
